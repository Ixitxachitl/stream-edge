# Build and test on every push and pull request, on all three desktop OSes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build StreamEdge.sln -c Release --nologo
      - run: dotnet test tests/managed/StreamEdge.Tests.csproj -c Release --no-build --nologo
      - run: dotnet test tests/ui/StreamEdge.UiTests.csproj -c Release --no-build --nologo
